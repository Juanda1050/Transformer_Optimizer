name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Filter "transformer_optimizer.exe" -Recurse | Select-Object -First 1

          if (-not $exe) {
            Write-Error "Executable not found"
            exit 1
          }

          & $exe.FullName

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null

          $exe = Get-ChildItem -Path build -Filter "transformer_optimizer.exe" -Recurse | Select-Object -First 1

          Copy-Item $exe.FullName package/transformer_optimizer.exe

          Compress-Archive `
            -Path package/transformer_optimizer.exe `
            -DestinationPath Transformer_Optimizer-Windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: Transformer_Optimizer-Windows-x64.zip

  build-macos:
    name: Build macOS Universal
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release

      - name: Run executable
        run: |
          EXE=$(find build -type f -name "transformer_optimizer" | head -n 1)

          if [ -z "$EXE" ]; then
            echo "Executable not found"
            exit 1
          fi

          "$EXE"

      - name: Prepare package
        run: |
          mkdir -p package

          EXE=$(find build -type f -name "transformer_optimizer" | head -n 1)

          cp "$EXE" package/transformer_optimizer

          chmod +x package/transformer_optimizer

          zip -r Transformer_Optimizer-macOS-universal.zip package/transformer_optimizer

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: Transformer_Optimizer-macOS-universal.zip

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-universal
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Transformer_Optimizer-Windows-x64.zip
            release/Transformer_Optimizer-macOS-universal.zip
          generate_release_notes: true
