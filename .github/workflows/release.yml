name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build Release
        run: cmake --build build --config Release

      - name: Prepare package
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Filter "transformer_optimizer.exe" -Recurse |
                 Select-Object -First 1

          if (-not $exe) {
            Write-Error "transformer_optimizer.exe was not found."
            exit 1
          }

          New-Item -ItemType Directory -Force -Path package | Out-Null

          Copy-Item $exe.FullName "package/transformer_optimizer.exe"

      - name: Run application and validate
        shell: pwsh
        working-directory: package
        run: |
          ./transformer_optimizer.exe

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Application validation failed."
            exit 1
          }

      - name: Add results
        shell: pwsh
        run: |
          if (-not (Test-Path "package/results.csv")) {
            Write-Error "results.csv was not generated."
            exit 1
          }

      - name: Prepare Windows release asset
        shell: pwsh
        run: |
          Copy-Item "package/transformer_optimizer.exe" "Transformer_Optimizer-Windows-x64.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: Transformer_Optimizer-Windows-x64.exe

  build-macos:
    name: Build macOS Universal
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build Release
        run: cmake --build build --config Release

      - name: Prepare package
        run: |
          EXE=$(find build -type f -name "transformer_optimizer" | head -n 1)

          if [ -z "$EXE" ]; then
            echo "transformer_optimizer was not found."
            exit 1
          fi

          mkdir -p package

          cp "$EXE" package/transformer_optimizer
          chmod +x package/transformer_optimizer

      - name: Run application and validate
        working-directory: package
        run: |
          ./transformer_optimizer

      - name: Check results
        run: |
          if [ ! -f "package/results.csv" ]; then
            echo "results.csv was not generated."
            exit 1
          fi

      - name: Verify Universal Binary
        run: |
          file package/transformer_optimizer

          file package/transformer_optimizer | grep -q "arm64"

          file package/transformer_optimizer | grep -q "x86_64"

      - name: Prepare macOS release asset
        run: |
          cp package/transformer_optimizer Transformer_Optimizer-macOS-universal
          chmod +x Transformer_Optimizer-macOS-universal

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: Transformer_Optimizer-macOS-universal

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release-assets/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-universal
          path: release-assets/macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/windows/Transformer_Optimizer-Windows-x64.exe
            release-assets/macos/Transformer_Optimizer-macOS-universal
          generate_release_notes: true
